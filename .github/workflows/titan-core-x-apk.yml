name: Build TITAN CORE X APK
"on":
  push:
    branches: [titan-core-x]
    paths:
      - 'TitanCoreX/**'
      - '.github/workflows/titan-core-x-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build real Android APK
        working-directory: TitanCoreX
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TITAN-CORE-X-APK
          path: TitanCoreX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
