name: TITAN Signed Threat Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: titan-core-x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Fetch and sign threat feed
        env:
          MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}
          TITAN_FEED_SIGNING_KEY_B64: ${{ secrets.TITAN_FEED_SIGNING_KEY_B64 }}
        run: python TitanCoreX/tools/feed_builder.py
      - name: Commit signed feed
        run: |
          git config user.name "titan-threat-bot"
          git config user.email "titan-threat-bot@users.noreply.github.com"
          git add TitanCoreX/threat-feed/feed.json TitanCoreX/threat-feed/feed.json.sig
          if ! git diff --cached --quiet; then
            git commit -m "Update signed threat intelligence feed"
            git push origin HEAD:titan-core-x
          fi
