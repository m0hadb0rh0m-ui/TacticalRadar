plugins { id 'com.android.application' }
android {
 namespace 'com.titancorex.app'
 compileSdk 35
 defaultConfig { applicationId 'com.titancorex.app'; minSdk 26; targetSdk 35; versionCode 300; versionName '3.0.0-beta.1' }
 buildFeatures { buildConfig true }
 def signingFingerprint = providers.gradleProperty('TITAN_SIGNING_SHA256').orElse('').get()
 if (signingFingerprint && !(signingFingerprint ==~ /(?i)[0-9a-f:]{64,95}/)) {
  throw new GradleException('TITAN_SIGNING_SHA256 must be a SHA-256 certificate fingerprint')
 }
 buildTypes {
  debug { debuggable true; buildConfigField 'String', 'EXPECTED_SIGNING_SHA256', '""' }
  release {
   buildConfigField 'String', 'EXPECTED_SIGNING_SHA256', '"' + signingFingerprint + '"'
   debuggable false
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
